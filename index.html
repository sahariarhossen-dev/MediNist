    <script>
      /* Ensure window.fetch is writable and configurable to prevent "Cannot set property fetch of #<Window> which has only a getter" and guard against "Failed to fetch" */
      (function() {
        if (typeof window !== 'undefined') {
          // Defensive error suppression for fetch getter issues and network dropouts
          window.addEventListener('error', function(event) {
            var msg = (event && event.message) || '';
            if (
              (msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1) ||
              msg.indexOf('Failed to fetch') !== -1 ||
              msg.indexOf('NetworkError') !== -1 ||
              msg.indexOf('Load failed') !== -1
            ) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);

          // Defensive rejection suppression for unhandled network failures
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason;
            var msg = typeof reason === 'string' ? reason : (reason && reason.message) || String(reason || '');
            if (
              msg.indexOf('Failed to fetch') !== -1 ||
              msg.indexOf('NetworkError') !== -1 ||
              msg.indexOf('Load failed') !== -1 ||
              (reason && reason.name === 'TypeError' && msg.indexOf('fetch') !== -1)
            ) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);
        }

        function wrapSafeFetch(fn, target) {
          if (typeof fn !== 'function') return fn;
          if (fn.__safeFetchWrapped) return fn;
          var wrapped = async function() {
            try {
              return await fn.apply(target || this, arguments);
            } catch (err) {
              var msg = (err && (err.message || String(err))) || '';
              if (
                msg.indexOf('Failed to fetch') !== -1 ||
                msg.indexOf('NetworkError') !== -1 ||
                msg.indexOf('Load failed') !== -1 ||
                (err && err.name === 'TypeError')
              ) {
                console.warn('[Fetch Guard] Handled network failure:', arguments[0], msg);
                return new Response(
                  JSON.stringify({
                    error: 'Network request failed (offline or endpoint unreachable)',
                    details: msg,
                    status: 503
                  }),
                  {
                    status: 503,
                    statusText: 'Service Unavailable',
                    headers: { 'Content-Type': 'application/json' }
                  }
                );
              }
              throw err;
            }
          };
          try {
            wrapped.__safeFetchWrapped = true;
          } catch (e) {}
          return wrapped;
        }

        function ensureFetchConfigurable(target) {
          if (!target) return;
          try {
            var raw = target.fetch;
            var bound = typeof raw === 'function' ? wrapSafeFetch(raw, target) : raw;

            // 1. Primary: define as writable, configurable value property directly on target
            try {
              Object.defineProperty(target, 'fetch', {
                value: bound,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              // 2. Fallback: if value cannot be set, supply both getter and setter
              var current = bound;
              try {
                Object.defineProperty(target, 'fetch', {
                  get: function() { return current; },
                  set: function(val) { current = wrapSafeFetch(val, target); },
                  configurable: true,
                  enumerable: true
                });
              } catch (e2) {}
            }
          } catch (e) {}
        }

        // Apply to window, Window.prototype, prototypes in chain, and globalThis
        if (typeof window !== 'undefined') {
          ensureFetchConfigurable(window);
          var proto = Object.getPrototypeOf ? Object.getPrototypeOf(window) : window.__proto__;
          while (proto && proto !== Object.prototype) {
            ensureFetchConfigurable(proto);
            proto = Object.getPrototypeOf ? Object.getPrototypeOf(proto) : proto.__proto__;
          }
        }
        if (typeof Window !== 'undefined' && Window.prototype) {
          ensureFetchConfigurable(Window.prototype);
        }
        if (typeof globalThis !== 'undefined') {
          ensureFetchConfigurable(globalThis);
        }
        if (typeof self !== 'undefined') {
          ensureFetchConfigurable(self);
        }
      })();
    </script>
